<svg xmlns="http://www.w3.org/2000/svg" viewBox="40.0 82.0 144.0 162.0" width="144.0" height="162.0" role="img" aria-label="Cohesian seed-pod logo">
  <!-- Cohesian seed-pod: MVP tree with the top node removed, left-upper node smaller. Remove <rect id="bg"> for transparent. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%"  stop-color="#FFFBF3"/>
      <stop offset="100%" stop-color="#F5E6CE"/>
    </radialGradient>
    <linearGradient id="stem" gradientUnits="userSpaceOnUse" x1="110.0" y1="226.0" x2="110.0" y2="82.0">
      <stop offset="0%"   stop-color="#B0561F"/>
      <stop offset="55%"  stop-color="#DC8330"/>
      <stop offset="100%" stop-color="#F4AC54"/>
    </linearGradient>
    <radialGradient id="dot" cx="38%" cy="34%" r="72%">
      <stop offset="0%"  stop-color="#FFE0B0"/>
      <stop offset="52%" stop-color="#F09A3C"/>
      <stop offset="100%" stop-color="#C4661E"/>
    </radialGradient>
    <radialGradient id="binder" cx="38%" cy="34%" r="72%">
      <stop offset="0%"  stop-color="#FFF6E6"/>
      <stop offset="48%" stop-color="#F7C56E"/>
      <stop offset="100%" stop-color="#DF9330"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.3" flood-color="#7A3C11" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect id="bg" x="40.0" y="82.0" width="144.0" height="162.0" fill="url(#bg)"/>

  <!-- branches -->
  <g filter="url(#soft)">
    <path d="M110.0 226.0 C 109.3 210.6 105.9 202.2 104.0 198.0" stroke="url(#stem)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M104.0 198.0 C 105.1 182.6 110.1 174.2 113.0 170.0" stroke="url(#stem)" stroke-width="2.79" fill="none" stroke-linecap="round"/>
    <path d="M104.0 198.0 C 106.2 190.8 116.2 186.9 122.0 185.0" stroke="url(#stem)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M113.0 170.0 C 109.8 159.0 94.6 153.0 86.0 150.0" stroke="url(#stem)" stroke-width="2.44" fill="none" stroke-linecap="round"/>
    <path d="M113.0 170.0 C 116.2 159.0 131.4 153.0 140.0 150.0" stroke="url(#stem)" stroke-width="2.44" fill="none" stroke-linecap="round"/>
    <path d="M113.0 170.0 C 113.0 149.1 113.0 137.7 113.0 132.0" stroke="url(#stem)" stroke-width="2.31" fill="none" stroke-linecap="round"/>
    <path d="M86.0 150.0 C 82.6 135.7 67.0 127.9 58.0 124.0" stroke="url(#stem)" stroke-width="2.1" fill="none" stroke-linecap="round"/>
    <path d="M86.0 150.0 C 86.7 124.7 90.1 110.9 92.0 104.0" stroke="url(#stem)" stroke-width="1.96" fill="none" stroke-linecap="round"/>
    <path d="M140.0 150.0 C 139.5 122.5 137.3 107.5 136.0 100.0" stroke="url(#stem)" stroke-width="1.93" fill="none" stroke-linecap="round"/>
    <path d="M140.0 150.0 C 143.1 137.9 157.7 131.3 166.0 128.0" stroke="url(#stem)" stroke-width="2.13" fill="none" stroke-linecap="round"/>
  </g>

  <!-- binder (glue) edges -->
  <g>
    <path d="M113.0 132.0 C 109.8 141.9 94.6 147.3 86.0 150.0" stroke="url(#binder)" stroke-width="2.16" fill="none" stroke-linecap="round" stroke-opacity="0.9"/>
    <path d="M113.0 132.0 C 116.2 141.9 131.4 147.3 140.0 150.0" stroke="url(#binder)" stroke-width="2.16" fill="none" stroke-linecap="round" stroke-opacity="0.9"/>
  </g>

  <!-- nodes -->
  <g fill="url(#dot)" filter="url(#soft)">
    <circle cx="110.0" cy="226.0" r="2.3"/>
    <circle cx="104.0" cy="198.0" r="2.9"/>
    <circle cx="122.0" cy="185.0" r="1.9"/>
    <circle cx="113.0" cy="170.0" r="3.5"/>
    <circle cx="86.0" cy="150.0" r="3.9"/>
    <circle cx="140.0" cy="150.0" r="3.9"/>
    <circle cx="58.0" cy="124.0" r="4.5"/>
    <circle cx="92.0" cy="104.0" r="3.9"/>
    <circle cx="136.0" cy="100.0" r="4.3"/>
    <circle cx="166.0" cy="128.0" r="4.4"/>
  </g>

  <!-- binder node -->
  <circle cx="113.0" cy="132.0" r="4.3" fill="url(#binder)"/>
</svg>
